name: Publish Artwork Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'LICENSE'
      - '.github/workflows/artwork-studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artwork-studio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build standalone studio
        run: |
          python3 studio/source/build.py --output _site/index.html
          cp LICENSE _site/LICENSE.txt
          cp studio/source/JSZip-LICENSE.markdown _site/JSZip-LICENSE.txt
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
