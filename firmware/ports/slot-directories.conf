d /storage/roms/bios        0755 root root - -
d /storage/roms/gamedata    0755 root root - -
d /storage/roms/savestates  0755 root root - -
d /storage/roms/screenshots 0755 root root - -
d /storage/roms/update      0755 root root - -
d /storage/roms/bezels      0755 root root - -
d /storage/roms/BGM         0755 root root - -
d /storage/roms/build       0755 root root - -
